<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block Detector</title>
<style>
  :root { --bg:#14161a; --panel:#1d2026; --line:#2c313a; --text:#e6e8eb; --dim:#9aa3ad; --accent:#4fa3ff; --warn:#f0b54a; --bad:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; margin:4px 0 14px; font-weight:600; }
  .bar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; }
  .bar label { color:var(--dim); }
  input[type=text] { background:#0f1114; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:7px 9px; width:220px; }
  button { background:var(--accent); color:#071422; border:0; border-radius:6px; padding:8px 16px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #drop { border:1px dashed var(--line); border-radius:6px; padding:7px 12px; color:var(--dim); cursor:pointer; }
  #drop.over { border-color:var(--accent); color:var(--text); }
  .cols { display:grid; grid-template-columns: 300px 1fr; gap:16px; margin-top:16px; }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .cell { aspect-ratio:1; border:1px solid var(--line); border-radius:6px; position:relative; display:flex; align-items:center; justify-content:center; font-weight:600; }
  .cell .n { position:absolute; top:4px; left:6px; font-size:11px; color:var(--dim); font-weight:400; }
  .cell .chip { width:46%; aspect-ratio:1; border-radius:4px; box-shadow:0 0 0 1px #0006 inset; }
  .robot { text-align:center; color:var(--dim); font-size:12px; margin-top:6px; letter-spacing:.08em; }
  .meta { color:var(--dim); font-size:12px; margin-top:10px; }
  ul.warn { margin:10px 0 0; padding-left:18px; color:var(--warn); }
  .err { color:var(--bad); font-weight:600; }
  .tabs { display:flex; gap:6px; margin-bottom:8px; }
  .tabs button { background:#0f1114; color:var(--dim); border:1px solid var(--line); padding:5px 10px; font-weight:500; }
  .tabs button.on { color:var(--text); border-color:var(--accent); }
  img.view { width:100%; border-radius:6px; background:#000; display:block; }
  details { margin-top:12px; } pre { white-space:pre-wrap; word-break:break-word; font-size:11px; color:var(--dim); max-height:320px; overflow:auto; }
</style>
</head>
<body>
<main>
  <h1>Block Detector</h1>
  <div class="bar">
    <span id="drop">Choose or drop a photo</span>
    <input id="file" type="file" accept="image/*" hidden>
    <label for="colors">Colours</label>
    <input id="colors" type="text" value="red,green,blue,yellow">
    <button id="go" disabled>Detect</button>
    <span id="status" class="meta" style="margin:0"></span>
  </div>

  <div class="cols">
    <div class="card">
      <div class="grid" id="grid"></div>
      <div class="robot">ROBOT SIDE</div>
      <div id="meta" class="meta"></div>
      <ul id="warn" class="warn"></ul>
    </div>
    <div class="card">
      <div class="tabs">
        <button data-k="annotated" class="on">Detections</button>
        <button data-k="photo">Photo</button>
        <button data-k="grid">Top-down</button>
      </div>
      <img id="view" class="view" alt="">
      <details><summary class="meta">Raw result</summary><pre id="raw"></pre></details>
    </div>
  </div>
</main>
<script>
const SW = { red:'#e23b3b', green:'#3cae4f', blue:'#2f74e0', yellow:'#f2cc2b', orange:'#f08a24', purple:'#9450c2', pink:'#ef7ab8' };
const $ = id => document.getElementById(id);
let file = null, last = null, tab = 'annotated';

function drawGrid(cells) {
  $('grid').innerHTML = '';
  for (let n = 1; n <= 9; n++) {
    const c = document.createElement('div'); c.className = 'cell';
    const color = cells && cells[n];
    c.innerHTML = `<span class="n">${n}</span>` + (color ? `<span class="chip" title="${color}" style="background:${SW[color] || '#888'}"></span>` : '');
    $('grid').appendChild(c);
  }
}
function pick(f) { if (!f) return; file = f; $('drop').textContent = f.name; $('go').disabled = false; }
function show() {
  if (!last || !last.files || !last.files[tab]) { $('view').removeAttribute('src'); return; }
  $('view').src = '/scans/' + last.files[tab];
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  tab = b.dataset.k; show();
});
$('drop').onclick = () => $('file').click();
$('file').onchange = e => pick(e.target.files[0]);
['dragover','dragenter'].forEach(t => $('drop').addEventListener(t, e => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave','drop'].forEach(t => $('drop').addEventListener(t, e => { e.preventDefault(); $('drop').classList.remove('over'); }));
$('drop').addEventListener('drop', e => pick(e.dataTransfer.files[0]));

$('go').onclick = async () => {
  if (!file) return;
  $('go').disabled = true; $('status').textContent = 'Detecting...';
  try {
    const q = encodeURIComponent($('colors').value.replace(/\s+/g, ''));
    const r = await fetch('/api/detect?colors=' + q, { method:'POST', headers:{'Content-Type': file.type || 'image/jpeg'}, body:file });
    last = await r.json();
    $('raw').textContent = JSON.stringify(last, null, 1);
    $('warn').innerHTML = '';
    if (!last.ok) {
      drawGrid(null);
      $('meta').innerHTML = `<span class="err">${last.error || 'failed'}</span>`;
    } else {
      drawGrid(last.cells);
      $('meta').textContent = `${last.layout.cell_mm} mm sheet, markers ${last.markers_used.join(', ')}, fit error ${last.reproj_mm} mm, ${last.timing_s.total} s (${last.backend})`;
    }
    (last.warnings || []).forEach(w => { const li = document.createElement('li'); li.textContent = w; $('warn').appendChild(li); });
    show();
    $('status').textContent = '';
  } catch (e) { $('status').textContent = 'Error: ' + e; }
  $('go').disabled = false;
};
drawGrid(null);
fetch('/api/health').then(r => r.json()).then(h => { $('colors').value = h.colors.join(','); $('status').textContent = 'Backend: ' + h.backend; });
</script>
</body>
</html>
